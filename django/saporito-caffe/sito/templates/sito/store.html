{% extends 'sito/main.html' %}
{% load static %}

{% block content %}

    <h3 class="center">Store</h3>

    <div class="row">
        {% for product in products %}
        <div class="col-lg-4">
            <img class="thumbnail saporito" src="{{product.imageURL}}">
            <div class="box-element product">
                <h6><strong>{{product.name}}</strong></h6>
                <hr>
            
                <button class="btn btn-outline-secondary add-btn">Add to Cart</button>
                <a class="btn btn-outline-success" href="#">View</a>
                <h4 style="display: inline-block; float: right">TND {{product.price}}</h4>
            </div>
        </div>
        {% endfor %}
    </div>

{% endblock content %}
